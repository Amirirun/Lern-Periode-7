<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Big Crypt</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <h1>Big Crypt</h1>
    <div class="input-wrapper">
      <input type="text" id="cryptoInput" placeholder="Deine Kryptowährung (z. B. bitcoin)">
      <ul id="autocomplete-list" class="autocomplete-list"></ul>
      <button onclick="loadChart()">Go</button>
    </div>
    <div id="priceDisplay"> Aktueller Preis: –</div>
  </header>

  <img src="83cea0af7010ed2944668f645d68aea3.jpg" class="centered-image" width="300" alt="Crypto Bild">

  <section id="chart-section">
    <canvas id="priceChart" width="800" height="400"></canvas>
  </section>
</body>
</html>
